<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RSS Curator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #0b0f14;
      color: #e6edf3;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111827;
      color: white;
    }

    .item {
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #222;
      border-radius: 10px;
      background: #111827;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    .meta {
      font-size: 12px;
      color: #9ca3af;
    }
    .columns {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #feed,
    #feed_blog {
      flex: 1;
      min-width: 0;
    }
  </style>
</head>

<body>
  <h1>🐦‍⬛Raven's Radar🐦‍⬛</h1>

  <input id="filter" placeholder="Filtering" />

  <div class="columns">
    <div id="feed">
      <h2>Curated Feed</h2>
    </div>
    <div id="feed_blog">
      <h2>Blog Posts</h2>
    </div>
  </div>

  <script src="https://unpkg.com/rss-parser/dist/rss-parser.min.js"></script>
  <script src="app.js"></script>
  <script src="blog.js"></script>
</body>
</html>
